<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invisible Maze</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <!-- ThreeJS & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- Dynamic Dark Foliage Background -->
    <div class="animated-bg">
        <div class="foliage-overlay"></div>
        <div class="glow glow1"></div>
        <div class="glow glow2"></div>
        <div class="vignette"></div>
    </div>

    <!-- UI CONTAINER -->
    <main id="ui-container">

        <!-- 1. MAIN LOBBY -->
        <section id="lobby" class="ui-panel glass-card">
            <h1 class="main-title">
                INVISIBLE
                <span>MAZE</span>
            </h1>
            <p class="tagline">🌿 Escape what cannot be seen. 🌿</p>

            <div class="input-group">
                <label for="input-name">YOUR NAME</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="input-name" placeholder="Enter your name..." autocomplete="off">
                </div>
            </div>

            <div class="input-group">
                <label for="input-code">ROOM CODE </label>
                <div class="input-wrapper">
                    <span class="input-icon">🔑</span>
                    <input type="text" id="input-code" maxlength="4" placeholder="Enter room code..." autocomplete="off">
                </div>
            </div>

            <div class="button-group">
                <button id="btn-create" class="btn-primary">
                    <span class="btn-icon">🍃</span> HOST A MAZE
                </button>
                <button id="btn-join" class="btn-secondary">
                    <span class="btn-icon">🔑</span> ENTER MAZE
                </button>
            </div>

            <div class="status-card">
                <div class="status-dot"></div>
                <p id="status">Connecting to server...</p>
            </div>

            <p class="footer-note">Guide your explorer. Escape together. 🌿</p>
        </section>

        <!-- HUD (In-Game Overlay Header) -->
        <div id="hud">
            <div class="hud-card glass-card">
                <div class="hud-avatar">👤</div>
                <div>
                    <div id="hud-role" class="hud-value">ROLE</div>
                    <div id="hud-stage" class="hud-sub">Stage 1 / 10</div>
                </div>
            </div>
        </div>

        <!-- Navigator Camera Controls Hint -->
        <div id="nav-controls-hint" class="glass-card">
            <div class="hint-item">
                <span class="hint-icon">🖱️</span>
                <div><strong>Left Drag</strong><small>Pan</small></div>
            </div>
            <div class="hint-item">
                <span class="hint-icon">🔄</span>
                <div><strong>Right Drag</strong><small>Rotate</small></div>
            </div>
            <div class="hint-item">
                <span class="hint-icon">🔍</span>
                <div><strong>Scroll</strong><small>Zoom</small></div>
            </div>
        </div>

    </main>

    <script src="game.js"></script>
</body>
</html>
